<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    /* Navbar */
    nav {
      background-color: #1a1a2e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      color: #e94560;
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav ul a {
      color: #ccc;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav ul a:hover {
      color: #e94560;
    }

    /* Error Section */
    .error-section {
      min-height: calc(100vh - 130px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #fff;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      color: #e94560;
      letter-spacing: -4px;
    }

    .error-divider {
      width: 60px;
      height: 4px;
      background-color: #e94560;
      border-radius: 2px;
      margin: 1.5rem auto;
    }

    .error-section h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    .error-section p {
      color: #aaa;
      font-size: 1rem;
      max-width: 460px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-primary {
      background-color: #e94560;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #c73652;
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      color: #ccc;
      border: 2px solid #555;
    }

    .btn-outline:hover {
      border-color: #e94560;
      color: #e94560;
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      background-color: #1a1a2e;
      color: #777;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
    }

    footer span {
      color: #e94560;
    }
  </style>
</head>
<body>

  <nav>
    <a href="/home" class="logo">MyApp</a>
    <ul>
      <li><a href="/home">Home</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>

  <section class="error-section">
    <div class="error-code">404</div>
    <div class="error-divider"></div>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist or has been moved. Check the URL or head back home.</p>
    <div class="btn-group">
      <a href="/home" class="btn btn-primary">Go Home</a>
      <a href="/contact" class="btn btn-outline">Contact Support</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 <span>MyApp</span>. All rights reserved.</p>
  </footer>

</body>
</html>
